<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EarthLens Insights</title><style>
*{box-sizing:border-box}body{margin:0;background:#081321;color:#e6f1fa;font:16px/1.6 system-ui,sans-serif}main{max-width:1040px;margin:auto;padding:32px 22px}header{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid #345064;padding-bottom:20px}h1,h2,h3,p{margin:0 0 12px}h1{font-size:clamp(28px,5vw,48px);line-height:1.1}h2{font-size:21px}small,.muted{color:#a8bacb}a{color:#67e8f9}label{display:block;color:#a8bacb;font-size:13px}select{background:#142c40;color:white;border:1px solid #54718a;border-radius:8px;padding:10px;font:inherit;max-width:100%}.controls{display:flex;gap:18px;flex-wrap:wrap;margin:24px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.card{background:#142c40;border:1px solid #2b455a;border-radius:14px;padding:20px;margin-bottom:16px}.metric{font-size:32px;color:#67e8f9;font-weight:700;line-height:1.2}.tag{color:#34d399;font-weight:650}.warning{border-left:4px solid #f59e0b}summary{cursor:pointer;color:#67e8f9}dl{display:grid;grid-template-columns:1fr auto;gap:8px}dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}footer{margin-top:24px;color:#a8bacb;font-size:13px}ul{padding-left:20px}button{font:inherit}section{min-width:0}</style><main><header><div><small>EARTHLENS / SCIENTIFIC EXPLAINABILITY</small><h1>EarthLens Insights</h1><p id="subtitle"></p></div><div><label for="lang">Language / Idioma</label><select id="lang"><option value="en">English</option><option value="es">Español</option></select></div></header><div class="controls"><div><label for="variable" id="varLabel"></label><select id="variable"></select></div></div><div id="content" aria-live="polite"></div><section class="card"><h2 id="glossTitle"></h2><div id="gloss"></div></section><footer id="footer"></footer></main><script src="demo-data.js"></script><script src="evidence_rules.js"></script><script>
const data=EarthLensData, rules=EarthLensInsights, $=id=>document.getElementById(id);let lang='en';
const tr=(a,b)=>lang==='es'?b:a; const num=(x,n=3)=>typeof x==='number'&&Number.isFinite(x)?x.toLocaleString(lang==='es'?'es-MX':'en-US',{maximumFractionDigits:n,minimumFractionDigits:0}):'—';
function el(tag,txt,cls){let n=document.createElement(tag);if(txt!==undefined)n.textContent=txt;if(cls)n.className=cls;return n}function card(title,body,cls=''){let s=el('section',undefined,'card '+cls);s.append(el('h2',title));if(typeof body==='string')s.append(el('p',body));else s.append(body);return s}function pair(dl,k,v){dl.append(el('dt',k),el('dd',v))}
function render(){lang=$('lang').value;document.documentElement.lang=lang;let selected=$('variable').value||'temp';$('variable').replaceChildren(...Object.entries(data.explanations).map(([k,v])=>{let o=el('option',v.title[lang]);o.value=k;return o}));$('variable').value=selected;let i=rules.getInsight(data,selected,lang),t=i.trend;
$('subtitle').textContent=tr('Understand the change. Inspect the evidence.','Comprende el cambio. Examina la evidencia.');$('varLabel').textContent=tr('Environmental variable','Variable ambiental');let root=$('content');root.replaceChildren();root.append(el('p',tr('Kalimantan study box · 2003–2024 · regional case study','Recuadro de Kalimantan · 2003–2024 · caso regional'),'muted'));
let status={increase:tr('Evidence of an increase','Evidencia de aumento'),decrease:tr('Evidence of a decrease','Evidencia de disminución'),inconclusive:tr('Inconclusive trend','Tendencia no concluyente'),method_sensitive:tr('Method-dependent trend','Tendencia dependiente del método'),unavailable:tr('Insufficient evidence','Evidencia insuficiente')}[i.status];
let block=el('div');block.append(el('div',(t.slope_decade>0?'+':'')+num(t.slope_decade)+' '+i.unit,'metric'),el('p',status,'tag'),el('p',tr('Estimated annual-series linear slope; not a causal explanation.','Pendiente lineal estimada de la serie anual; no explica la causa.')));root.append(card(tr('What changed?','¿Qué cambió?'),block));
let grid=el('div',undefined,'grid');grid.append(card(tr('Why might it happen?','¿Por qué podría ocurrir?'),i.mechanism),card(tr('What cannot we conclude?','¿Qué no podemos concluir?'),i.limitations,'warning'));root.append(grid);
let dl=el('dl');pair(dl,tr('NASA product','Producto NASA'),i.source);pair(dl,tr('Annual observations','Observaciones anuales'),t.n);pair(dl,'HAC p',num(t.p_hac,5));pair(dl,'BH q',num(t.q_hac_bh,5));pair(dl,'OLS p',num(t.p_ols,5));pair(dl,'Kendall p',num(t.kendall_p,5));pair(dl,tr('95% HAC interval / decade','Intervalo HAC 95% / década'),num(t.hac_ci_low)+' to '+num(t.hac_ci_high));let stat=el('div');stat.append(dl,el('p',tr('HAC lag 2, 22 years; inference remains exploratory.','HAC con rezago 2, 22 años; la inferencia sigue siendo exploratoria.'),'muted'));root.append(card('Evidence Passport',stat));
let as=selected==='burned_area_km2'?data.regional.associations.filter(a=>a.scope==='Jul-Oct'||a.scope==='Jul-Oct coverage >= 90% every month'):i.associations.filter(a=>a.scope==='Jul-Oct'||a.scope==='Jul-Oct coverage >= 90% every month');if(as.length){let d=el('dl');as.forEach(a=>pair(d,data.explanations[a.variable].title[lang]+' · '+(a.n===20?tr('filtered','filtrado'):tr('all','total'))+' (n='+a.n+')','ρ '+num(a.rho)));let b=el('div');b.append(d,el('p',tr('July–October Spearman associations with detected burned area; filtered seasons require ≥90% MODIS coverage every month. Association does not establish causation.','Asociaciones Spearman julio–octubre con superficie quemada detectada; temporadas filtradas requieren ≥90% de cobertura MODIS cada mes. Asociación no demuestra causalidad.')));root.append(card(tr('Environmental relationships','Relaciones ambientales'),b))}
if(i.quality){let q=i.quality;root.append(card(tr('Data quality warning','Advertencia de calidad'),tr('October 2015: valid land coverage '+num(q.min_coverage*100,2)+'%. Low coverage can hide burned area. July–October accounts for '+num(q.fire_season_share*100,2)+'% of detected area (2003–2024).','Octubre 2015: cobertura terrestre válida '+num(q.min_coverage*100,2)+'%. La baja cobertura puede ocultar superficie quemada. Julio–octubre concentra '+num(q.fire_season_share*100,2)+'% del área detectada (2003–2024).'),'warning'));let cells=data.spatial;root.append(card(tr('Spatial evidence','Evidencia espacial'),tr('62 fitted cells; '+cells.filter(c=>rules.spatialStatus(c)==='nominal_only'||rules.spatialStatus(c)==='bh_only'||rules.spatialStatus(c)==='by_significant').length+' nominally significant; '+cells.filter(c=>rules.spatialStatus(c)==='bh_only'||rules.spatialStatus(c)==='by_significant').length+' after BH; '+cells.filter(c=>rules.spatialStatus(c)==='by_significant').length+' after BY. Nearby cells are not independent.','62 celdas analizadas; 19 significativas nominalmente, 2 tras BH, 0 tras BY. Las celdas vecinas no son independientes.')))}
let ul=el('ul');i.references.forEach(r=>{let li=el('li'),a=el('a',r.title);a.href=r.url;a.target='_blank';a.rel='noopener noreferrer';li.append(a);ul.append(li)});root.append(card(tr('Scientific sources','Fuentes científicas'),ul));$('glossTitle').textContent=tr('Science glossary','Glosario científico');$('gloss').replaceChildren(...Object.entries(data.glossary).map(([k,v])=>{let d=el('details');d.append(el('summary',k.replaceAll('_',' ')),el('p',v[lang]));return d}));$('footer').textContent=tr('Standalone regional demonstration. AI-assisted code and educational text; metrics from deterministic team analyses. No forecasts or global attribution.','Demostración regional independiente. Código y texto educativo asistidos por IA; métricas de análisis deterministas del equipo. Sin predicción ni atribución global.');}
$('lang').addEventListener('change',render);$('variable').addEventListener('change',render);render();
</script></html>
